name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/translation-layer/test_apk_order.py'
      - 'tests/java-framework/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test Java view hierarchy
        run: python3 tests/java-framework/run.py
      - name: Extract Android runtime from pinned Lineage image
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils e2fsprogs
          mkdir -p build/runtime-source
          curl --fail --location --retry 3 --output build/vda.qcow2 \
            https://github.com/Leviidev/Husk/releases/download/lineage-v2/vda-v12.qcow2
          echo 'a8dbaecc8fdcd682991b078d6bbb7df6972e459208634fa8dcbad24f17208d6a  build/vda.qcow2' | sha256sum --check
          qemu-img convert -O raw build/vda.qcow2 build/vda.raw
          python3 scripts/extract_android_runtime.py build/vda.raw build/runtime-source
      - name: Build Java framework and stage runtime
        run: |
          curl --fail --location --retry 3 --output build/r8.jar \
            https://storage.googleapis.com/r8-releases/raw/8.5.35/r8.jar
          HUSK_JDK="$JAVA_HOME" HUSK_D8="$PWD/build/r8.jar" \
            HTTP_LEGACY="$PWD/build/runtime-source/org.apache.http.legacy.jar" \
            FRAMEWORK_RES="$PWD/build/runtime-source/framework-res.apk" \
            bash scripts/build_java_runtime.sh "$PWD/build/runtime-source/apex"
          cp -R build/runtime-source/android-system build/android-system
          python3 scripts/validate_android_runtime.py build
      - name: Upload runtime data
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime
          path: |
            build/java-runtime
            build/android-system
          if-no-files-found: error
          retention-days: 14
  build:
    needs: runtime
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      DD: /tmp/husk_ipa
    steps:
      - uses: actions/checkout@v4
      - name: Test base APK selection
        run: python3 tests/translation-layer/test_apk_order.py
      - name: Install build tools
        run: |
          brew install xcodegen qemu
          rustup target add aarch64-apple-ios
          xcodebuild -downloadComponent MetalToolchain
      - name: Stage upstream binary dependencies
        run: |
          mkdir -p build/bootstrap
          curl --fail --location --retry 3 --output build/bootstrap/Husk.ipa \
            https://github.com/Leviidev/Husk/releases/download/2.0/Husk.ipa
          python3 scripts/stage_release_dependencies.py build/bootstrap/Husk.ipa
          xcodebuild -create-xcframework -framework "$PWD/build/bootstrap/MoltenVK.framework" \
            -output "$PWD/build/ios-arm64/lib/MoltenVK.xcframework"
      - name: Download Android runtime data
        uses: actions/download-artifact@v4
        with:
          name: android-runtime
          path: build
      - name: Build pairing library
        run: bash scripts/build_rppairing_ios.sh
      - name: Build app and package IPA
        run: bash scripts/package_ipa.sh "$PWD/build/Husk.ipa"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-IPA-${{ github.sha }}
          path: build/Husk.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-build-log-${{ github.sha }}
          path: /tmp/husk_ipa/build.log
          if-no-files-found: ignore
          retention-days: 14
